[project]
name = "jatayu"
version = "0.1.0"
description = "Mandate-driven candidate sourcing & ranking for executive search"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "openpyxl>=3.1"]

[project.optional-dependencies]
live = ["requests>=2.31", "python-dotenv>=1.0"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
jatayu = "jatayu.cli:main"
